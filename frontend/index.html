<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лаба 0 — Заметки</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 22px; }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; }
    li {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .meta {
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }
    #status { color: #b00; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Заметки</h1>
  <p>Форма ниже пишет в базу через бэкенд, список ниже — читает из базы. Обновите страницу — записи останутся.</p>

  <form id="note-form">
    <input type="text" id="note-text" placeholder="Новая заметка..." required />
    <button type="submit">Добавить</button>
  </form>
  <div id="status"></div>

  <ul id="notes-list"></ul>

  <script>
    const form = document.getElementById('note-form');
    const input = document.getElementById('note-text');
    const list = document.getElementById('notes-list');
    const status = document.getElementById('status');

    async function loadNotes() {
      status.textContent = '';
      try {
        const res = await fetch('/api/notes');
        if (!res.ok) throw new Error('Сервер вернул ' + res.status);
        const notes = await res.json();
        renderNotes(notes);
      } catch (err) {
        status.textContent = 'Не удалось загрузить заметки: ' + err.message;
      }
    }

    function renderNotes(notes) {
      list.innerHTML = '';
      for (const note of notes) {
        const li = document.createElement('li');
        const date = new Date(note.created_at).toLocaleString('ru-RU');
        li.innerHTML = `${escapeHtml(note.text)}<div class="meta">#${note.id} · ${date}</div>`;
        list.appendChild(li);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      status.textContent = '';
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || ('Сервер вернул ' + res.status));
        }
        input.value = '';
        await loadNotes();
      } catch (err) {
        status.textContent = 'Не удалось сохранить заметку: ' + err.message;
      }
    });

    loadNotes();
  </script>
</body>
</html>
